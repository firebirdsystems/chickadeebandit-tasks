<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tasks Widget</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      font-size: 13px;
      background: var(--hub-surface, #fff);
      color: var(--hub-text, #111827);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px 8px;
      border-bottom: 1px solid #e5e7eb;
      flex-shrink: 0;
    }
    .header-title { font-size: 13px; font-weight: 700; color: var(--hub-text, #111827); }
    .header-count { font-size: 11px; color: var(--hub-text-muted, #6b7280); }

    .task-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }

    .task-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      cursor: pointer;
      transition: background .1s;
      border-bottom: 1px solid #f3f4f6;
    }
    .task-row:last-child { border-bottom: none; }
    .task-row:hover { background: var(--hub-bg, #f9fafb); }
    .task-row.done { opacity: .55; }

    .check {
      width: 18px; height: 18px;
      border-radius: 50%;
      border: 2px solid #d1d5db;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px;
      color: transparent;
      transition: all .15s;
    }
    .check.overdue { border-color: #dc2626; }
    .task-row.done .check {
      background: #16a34a;
      border-color: #16a34a;
      color: #fff;
    }

    .task-name {
      flex: 1;
      font-size: 12.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .task-row.done .task-name {
      text-decoration: line-through;
      color: #9ca3af;
    }

    .due-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 8px;
      flex-shrink: 0;
    }
    .due-badge.overdue { background: var(--hub-tint-danger, #fee2e2); color: var(--hub-tint-danger-fg, #dc2626); }
    .due-badge.today   { background: var(--hub-tint-info, #dbeafe); color: var(--hub-tint-info-fg, #1d4ed8); }

    .footer {
      padding: 7px 14px;
      border-top: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      background: var(--hub-bg, #f9fafb);
    }
    .footer-status { font-size: 11px; color: var(--hub-text-muted, #6b7280); }
    .footer-status strong { color: var(--hub-text, #111827); }
    .open-link {
      font-size: 11px;
      font-weight: 600;
      color: var(--hub-text, #111827);
      text-decoration: none;
    }
    .open-link:hover { text-decoration: underline; }

    .empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #9ca3af;
      font-size: 12px;
      gap: 6px;
      padding: 12px;
      text-align: center;
    }
    .alert { margin: 8px; padding: 8px 10px; border-radius: 10px; background: var(--hub-tint-danger, #fee2e2); color: var(--hub-tint-danger-fg, #b91c1c); font-size: 0.8rem; }
  </style>
</head>
<body>
<script type="module">
import { esc, glyph, chickadee } from "/hub-sdk.js";
import {
  isOverdue, isToday, todayStr, parseLabels,
  savedAssigneeId, nextOccurrence, taskInsert, taskCreatedPayload, taskCompletedPayload,
  NEXT_OCCURRENCE_FAILED,
} from "./logic.js";

const DB         = window.__DB_URL ?? "";
const APP_ID     = window.__APP_ID ?? "tasks";
const ME         = window.__CURRENT_MEMBER ?? null;
const EVENTS_URL = window.__EVENTS_URL ?? "";
const TENANT     = { tenantKind: window.__TENANT_KIND ?? "household", isAdmin: window.__IS_ADMIN === true };

let tasks = [];
let completing = new Set();
function jsArg(value) { return esc(JSON.stringify(String(value))); }

async function dbq(sql, params = []) {
  if (!DB) return { rows: [] };
  {
    const res = await fetch(DB, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sql, params }),
    });
    const json = await res.json().catch(() => null);
    // The hub reports a refused write as a JSON body with an `error` key
    // (403 row policy, 400 bad statement, 507 over quota). fetch() does not
    // reject on those, so without this throw every caller's rollback and
    // error toast below is unreachable code.
    if (!res.ok || !json || typeof json !== "object" || json.error) throw new Error(json?.error || `Database request failed (${res.status})`);
    return json;
  }
}

/** Fire-and-forget publish, as the page does it: ids and dates only. */
async function publishEvent(type, subjectId, payload = {}) {
  if (!EVENTS_URL) return;
  await fetch(EVENTS_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ type, subject_id: subjectId, payload }),
  }).catch(() => {});
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

async function createTask(fields) {
  const id = uid();
  const ts = new Date().toISOString();
  const assigneeId = savedAssigneeId(fields.assignee_id, ME, TENANT);
  const insert = taskInsert(id, fields, assigneeId, ME?.id, ts);
  await dbq(insert.sql, insert.params);
  await publishEvent("task.created", id, taskCreatedPayload(id, fields, assigneeId, ME?.id));
  return id;
}

async function load() {
  if (!ME?.id) { render(); return; }

  const { rows } = await dbq(
    `SELECT id, list_id, title, notes, due_date, due_time, priority, labels, recurrence, completed, assignee_id, created_by
     FROM app_tasks__tasks
     WHERE parent_id IS NULL
       AND (assignee_id = ? OR (assignee_id IS NULL AND created_by = ?) OR (assignee_id IS NULL AND created_by IS NULL))
     ORDER BY due_date, priority DESC, created_at`,
    [ME.id, ME.id]
  );
  tasks = rows ?? [];
  render();
}

// Said above the list after a completion whose follow-up did not save.
let notice = "";

async function toggleTask(id) {
  if (completing.has(id)) return;
  completing.add(id);

  const t = tasks.find(t => t.id === id);
  if (!t) { completing.delete(id); return; }

  const newVal = t.completed ? 0 : 1;
  const completedAt = newVal ? new Date().toISOString() : null;
  t.completed = newVal;
  render();

  // A refused write, or one the hub narrowed to nothing (the task was
  // reassigned or deleted), puts the row back as it was.
  let saved = false;
  try {
    const res = await dbq(
      `UPDATE app_tasks__tasks SET completed = ?, completed_at = ?, updated_at = ? WHERE id = ?`,
      [newVal, completedAt, new Date().toISOString(), id]
    );
    saved = !DB || res?.changed !== 0;
  } catch { /* saved stays false */ }
  if (!saved) {
    t.completed = newVal ? 0 : 1;
    render();
  } else if (newVal) {
    notice = "";
    // The same follow-up as completing in the app: announce it, and leave a
    // repeating task's next occurrence behind. Un-completing announces
    // nothing, since the bus has no retraction.
    await publishEvent("task.completed", id, taskCompletedPayload(t, ME?.id, completedAt));
    const next = nextOccurrence(t);
    if (next) {
      // The completion itself is saved; only the next occurrence is missing.
      const scheduled = await createTask(next).then(() => true, e => { console.error(e); return false; });
      if (scheduled) {
        try { await load(); } catch { /* the completion itself is saved */ }
      } else {
        notice = NEXT_OCCURRENCE_FAILED;
        render();
      }
    }
  }
  completing.delete(id);
}

function render() {
  if (!ME?.id) {
    document.body.innerHTML = `
      <div class="header"><span class="header-title">${glyph("checklist")} Tasks</span></div>
      <div class="empty">
        <span>Sign in to see your tasks</span>
        <a href="/run/${APP_ID}" style="color:#111827;font-weight:600;font-size:11px">Open app →</a>
      </div>`;
    return;
  }

  const today = todayStr();
  const visible = tasks.filter(t => !t.completed && (isOverdue(t, today) || isToday(t, today)));
  const doneToday = tasks.filter(t => t.completed && t.due_date === today);
  const totalOpen = tasks.filter(t => !t.completed).length;

  const header = `
    <div class="header">
      <span class="header-title">${glyph("checklist")} Tasks</span>
      <span class="header-count">${totalOpen} open</span>
    </div>`;

  let content;
  if (visible.length === 0 && !DB) {
    content = `<div class="empty"><span>No tasks yet</span><a href="/run/${APP_ID}" style="color:#111827;font-weight:600;font-size:11px">Create tasks →</a></div>`;
  } else if (visible.length === 0) {
    content = `<div class="empty">${chickadee("sleeping", { size: 56 })}<span>All caught up for today!</span></div>`;
  } else {
    // Overdue first, then today
    const sorted = [...visible].sort((a, b) => {
      const aOver = isOverdue(a, today), bOver = isOverdue(b, today);
      if (aOver !== bOver) return aOver ? -1 : 1;
      return (b.priority ?? 0) - (a.priority ?? 0);
    });

    content = `<div class="task-list">
      ${sorted.map(t => {
        const overdue = isOverdue(t, today);
        const badge = overdue
          ? `<span class="due-badge overdue">Overdue</span>`
          : `<span class="due-badge today">Today</span>`;
        return `<div class="task-row${t.completed ? ' done' : ''}" onclick="doToggle(${jsArg(t.id)})">
          <div class="check${overdue && !t.completed ? ' overdue' : ''}">${t.completed ? glyph('tick', { accent: 'currentColor' }) : ''}</div>
          <span class="task-name">${esc(t.title)}</span>
          ${badge}
        </div>`;
      }).join('')}
    </div>`;
  }

  const doneCount = doneToday.length;
  const footer = `
    <div class="footer">
      <span class="footer-status">${doneCount > 0 ? `<strong>${doneCount}</strong> done today` : 'Nothing done yet today'}</span>
      <a class="open-link" href="/run/${APP_ID}">All tasks →</a>
    </div>`;

  const note = notice ? `<div class="alert" role="alert">${esc(notice)}</div>` : "";
  document.body.innerHTML = header + note + content + footer;
}

window.doToggle = id => toggleTask(id).catch(() => {});

load().catch(() => {
  document.body.innerHTML = `
    <div class="header"><span class="header-title">${glyph("checklist")} Tasks</span></div>
    <div class="alert" data-testid="load-error" role="alert">Couldn’t load your tasks.</div>
    <div class="empty">
      <a href="/run/${APP_ID}" style="color:#111827;font-weight:600;font-size:11px">Open app →</a>
    </div>`;
});
</script>
</body>
</html>
